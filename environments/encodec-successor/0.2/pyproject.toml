[project]
name = "qste-encodec-environment"
version = "0.2.0"
description = "Non-activating dependency successor to the frozen EnCodec P9 environment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "encodec==0.1.1",
  "einops==0.8.1",
  "numpy==1.26.4",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "torchcodec==0.17.0",
  "filelock>=4.2.7,<5",
  "setuptools>=84.2.1,<85",
]

[tool.uv]
package = false
